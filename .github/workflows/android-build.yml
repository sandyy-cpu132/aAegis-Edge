name: Aegis Edge Android CI & APK Delivery

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed release APK if signing secrets are configured"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Part 3.8: Least-privilege GITHUB_TOKEN permissions
permissions:
  contents: read

jobs:
  build-and-verify:
    name: Verify Security, Run Tests & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository (Pinned SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17 (Pinned SHA)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle with dependency caching (Pinned SHA)
        uses: gradle/actions/setup-gradle@f29f5a9dfa6b0ed6ab54bde4efbe1c8f9f1a6f33 # v4.3.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Static Security Policy Check (Zero INTERNET Permission & Backup Disabled)
        run: |
          if grep -q 'android:allowBackup="true"' app/src/main/AndroidManifest.xml; then
            echo "SECURITY FAILURE: android:allowBackup must be false"
            exit 1
          fi
          if ! grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml || ! grep -q 'tools:node="remove"' app/src/main/AndroidManifest.xml; then
            echo "SECURITY FAILURE: Manifest must explicitly remove android.permission.INTERNET"
            exit 1
          fi
          echo "Static manifest security checks passed."

      - name: Run Unit & Robolectric Security Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact (Pinned SHA)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aegis-edge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Conditionally Assemble Signed Release APK
        if: ${{ github.event_name != 'pull_request' && env.HAS_SIGNING_SECRETS == 'true' }}
        env:
          HAS_SIGNING_SECRETS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/release-signing.jks
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          gradle :app:assembleRelease --no-daemon
          rm -f "$KEYSTORE_PATH"

      - name: Upload Signed Release APK Artifact (Pinned SHA)
        if: ${{ github.event_name != 'pull_request' && success() && hashFiles('app/build/outputs/apk/release/*.apk') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aegis-edge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30
